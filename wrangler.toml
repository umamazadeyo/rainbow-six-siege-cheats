# Astro + @astrojs/cloudflare — build with: npm run build:cloudflare
name = "r6siegecheat"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

main = "./dist/_worker.js/index.js"

[assets]
directory = "./dist"
binding = "ASSETS"

[build]
command = "npm run build:cloudflare"

[vars]
# Set secrets in the Cloudflare dashboard; do not commit credentials here.
